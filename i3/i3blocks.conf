# Disk usage
#
# The directory defaults to $HOME if the instance is not specified.
# The script may be called with a optional argument to set the alert
# (defaults to 10 for 10%).
# Disk usage (crystalBlue)
[disk]
label=  
instance=/
command=~/.config/i3/scripts/disk | awk '{print $0 "  "}'
interval=30
color=#727169
# background=#7E9CD8

# Memory usage (waveAqua1)
[memory]
label=  
command=~/.config/i3/scripts/memory | awk '{print $0 "  "}'
interval=2
color=#dcd7ba
background=#54546d
# CPU Temperature (autumnYellow)
[CPU-temperature]
label= 
command=~/.config/i3/scripts/temperature | awk '{print $0 "  "}'
interval=30
color=#727169
# background=#6A9589


# Battery indicator (springGreen)
[battery]
label=  
command=~/.config/i3/scripts/battery-pinebook-pro | awk '{print $0 " "}'
interval=30
color=#363646
background=#938aa9

# Power Profiles Menu (waveRed)
# [ppd_menu]
# full_text=  
# command=~/.config/i3/scripts/power-profiles
# color=#727169
# background=#E46876

# Time (oniViolet)
[time]
label=  
command=date '+%a %d %b %H:%M:%S '
interval=1
color=#727169
# background=#957FB8
