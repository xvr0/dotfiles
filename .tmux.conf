unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


bind -n C-Tab next-window
bind -n C-S-Tab previous-window

set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' 
set -g @plugin 'tmux-plugins/tmux-yank'    

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g status-position top

# ----------------- Kanagawa Theme -----------------
set -g @plugin 'Nybkox/tmux-kanagawa'

# Available themes: wave (default), dragon, lotus
set -g @kanagawa-theme 'wave'

# To simulate your previous "transparent" setting and maintain terminal backgrounds
set -g @kanagawa-ignore-window-colors true

# To mimic your previous "show_datetime 0" preference, define exactly which status 
# modules you want (e.g., leaving out 'time'). 
# Example modules: 'cpu-usage ram-usage network battery'
set -g @kanagawa-plugins " "
# --------------------------------------------------

set -g visual-activity off
bind-key b set-option status

run '~/.tmux/plugins/tpm/tpm'
